<script language="JavaScript">

function setTextareaSizes( taId ) {
    const inp = document.getElementById(taId);
    if(inp) {
      var inpParent = inp.parentElement;

      while( inpParent && inpParent.width === undefined)
        inpParent = inpParent.parentElement;
      //console.log("inpParent is" + inpParent.tagName + 
      //            ", sizeClient: " + inpParent.clientWidth + " x " + inpParent.clientHeight +
      //            ", size: " + inpParent.width + " x " + inpParent.height);

      inp.style.top = '50px';
      inp.style.left = '4px';
      inp.style.width = String(inpParent.clientWidth-24) + "px";
      inp.width = String(inpParent.clientWidth-24) + "px";
      if( window.myApp ) {
        //console.log("SplitterTop:" + window.myApp.getSplitterTop());
        var t1 =  (inpParent.clientHeight * Math.trunc(window.myApp.getSplitterTop())) / 100 - 96;
        inp.style.height = String(t1) + "px";
        inp.height =  String(t1) + "px";
      }            
      else {
        console.log("theApp not accessible");              
        //inpEnv.style.height = String(inpEnvParent.clientHeight-256) + "px";
        //inpEnv.height =  String(inpEnvParent.clientHeight-256) + "px";
      }
      //console.log("inpEnv: " + inpEnv.width + " x " + inpEnv.height);
    }
}

function setSizes() {
  var w = window.innerWidth;
  var h = window.innerHeight;
  const menuBar = document.getElementById("menuBar");
  const ws = document.getElementById("workspace");
  console.log("SET SIZES");
  if(ws) {
    ws.width = w;
    ws.height = h - 50;

    const diagPanel =  document.getElementById("diag");
    if(diagPanel) {
      const dPanel = diagPanel.parentElement;  
      diagPanel.height =  ws.height / 4;
      dPanel.clientHeight = ws.height / 4;
    }
    else
      console.log("diagPanel not found");

    setTextareaSizes("txtEnv");
    setTextareaSizes("txtBeh");
    setTextareaSizes("txtAct");
    setTextareaSizes("txttgt");
  }
}

</script>
