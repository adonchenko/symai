[SymAI]
tempdir = tmpdir/temp
host = localhost
port = 12345
expression_host = localhost
expression_port = 8080
ai = False
reenter_count = 1
debug = False

[Expression]
host = localhost
port = 8080
expression_solver = Z3
solver_max_models = 10

[Frontend]
host = localhost
port = 8000
symaicore_port = 12345
symaicore_host = localhost
resources = app/resources

[loggers]
keys = root, expression, symaicore, frontend

[handlers]
keys = consoleHandler,file,file_symaicore, file_frontend

[formatters]
keys = simpleFormatter

[logger_root]
level = DEBUG
handlers = consoleHandler

[logger_expression]
level = DEBUG
handlers = consoleHandler,file
qualname = expression
propagate = 0

[logger_symaicore]
level = DEBUG
handlers = consoleHandler,file_symaicore
qualname = symaicore
propagate = 0

[logger_frontend]
level = DEBUG
handlers = consoleHandler,file_frontend
qualname = frontend
propagate = 0

[handler_consoleHandler]
class = StreamHandler
level = DEBUG
formatter = simpleFormatter
args = (sys.stdout,)

[formatter_simpleFormatter]
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s

[handler_file]
class = handlers.TimedRotatingFileHandler
interval = midnight
backupcount = 5
level = DEBUG
formatter = simpleFormatter
args = ('tmpdir/temp/logdir/expression.log',)

[handler_file_symaicore]
class = handlers.TimedRotatingFileHandler
interval = midnight
backupcount = 5
level = DEBUG
formatter = simpleFormatter
args = ('tmpdir/temp/logdir/symaicore.log',)

[handler_file_frontend]
class = handlers.TimedRotatingFileHandler
interval = midnight
backupcount = 5
level = DEBUG
formatter = simpleFormatter
args = ('tmpdir/temp/logdir/frontend.log',)

