<style>
  main {
    width: 100%;
    min-height: 100%;
    display: flex;
    font-family: Arial, Helvetica, sans-serif; 
    /*
    justify-content: center;
    align-items: center;
    */
    padding: 1rem;
    /*box-sizing: inherit;*/
    position: relative;
  }

  .div-table {
    display: table;         
    width: 100%;      
    height: 100%;   
    background-color: #eee;         
    border: none;         
    border-spacing: 0px; /* cellspacing:poor IE support for  this */
  }

  .div-table-row {
    display: table-row;
    width: auto;
    clear: both;
  }

  .Absolute-Center {
    width: 50%;
    height: 50%;
    overflow: auto;
    margin: auto;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0; 
    min-width: 20%;
    max-width: 80%;
    min-height: 20%;
    max-height: 80%;
    resize: both;
    z-index: 9999;
    border: 2px solid grey;
  }  
  
</style>

<main class="main"><div class="div-table" style="overflow:auto;">

    <div id="menuBar" class="div-table-row">
      <p-menubar [model]="items" [style]="{height:'36px'}"/>
      <!--
      <input type="button" id="envLoader" (click)="doLoadEnv(true)" style="visibility: hidden;" />
      <input type="button" id="behLoader" (click)="doLoadBeh(true)" style="visibility: hidden;" />
      <input type="button" id="actLoader" (click)="doLoadAct(true)" style="visibility: hidden;" />
      <input type="button" id="tgtLoader" (click)="doLoadTgt(true)" style="visibility: hidden;" />

      <input type="hidden" id="hiddenRefresh" value="" style="visibility: hidden;" />
      <input type="button" id="cmdRefresh" style="visibility: hidden; width: 0px; height: 0px; overflow: hidden;" onclick="do_refresh();" />
      -->
    </div>
    <div class="div-table-row" style="margin: 4px;"></div>
    <div id="workspace" class="div-table-row">
      <p-splitter id="splitter"
                  [style]="{ height: '700px', width: '100%' }" class="mb-8" layout="vertical" 
                  [minSizes]="[30,10]" [panelSizes]="[75,25]"
                  (onResizeEnd)="onSplitterResizeEnd($event)">

        
        <ng-template #panel>
        <div id="theTabs">
        <p-tabs [(value)]="tabVal" (valueChange)="tabChange();"  onchange="adjustSizes();">
          <p-tablist>
              <p-tab [value]="0">Environment</p-tab>
              <p-tab [value]="1">Behavior</p-tab>
              <p-tab [value]="2">Actions</p-tab>
              <p-tab [value]="3">Property</p-tab>
              <p-tab [value]="4">Execution</p-tab>
          </p-tablist>

          <p-tabpanels>
            <p-tabpanel [value]="0">

              <div>
                <input type="file" #fileEnv maxFileSize="100000000" 
                      (onSelect)="handleEnvFileInput($event)" 
                      (change)="handleEnvFileInput($event)" 
                      id="fileEnv" name="fileEnv" style="height: 24px;" />
              </div>
              <textarea id="txtEnv" [(ngModel)]='cntEnv' name="txtEnv" #txtEnv='ngModel' spellcheck="false"
                        style="height: 400px; width: 600px;"></textarea>            
            
            </p-tabpanel>

            <p-tabpanel [value]="1">

              <div>
                <input type="file" #fileBeh maxFileSize="100000000" 
                      (onSelect)="handleBehFileInput($event)" 
                      (change)="handleBehFileInput($event)" 
                      id="fileBeh" name="fileBeh" style="height: 24px;" />
              </div>
              <textarea id="txtBeh" [(ngModel)]='cntBeh' name="txtBeh" #txtBeh='ngModel' spellcheck="false"
                        style="height: 400px; width: 600px;"></textarea>            
            
            </p-tabpanel>

            <p-tabpanel [value]="2">

              <div>
                <input type="file" #fileAct maxFileSize="100000000" 
                      (onSelect)="handleActFileInput($event)" 
                      (change)="handleActFileInput($event)" 
                      id="fileAct" name="fileAct" style="height: 24px" />
              </div>
              <textarea id="txtAct" [(ngModel)]='cntAct' name="txtAct" #txtAct='ngModel' spellcheck="false"
                        style="height: 400px; width: 600px;"></textarea>            
            
            </p-tabpanel>

            <p-tabpanel [value]="3">

              <div>
                <input type="file" #fileTgt maxFileSize="100000000" 
                      (onSelect)="handleTgtFileInput($event)" 
                      (change)="handleTgtFileInput($event)" 
                      id="fileTgt" name="fileTgt" style="height: 24px;" />
              </div>
              <textarea id="txtTgt" [(ngModel)]='cntTgt' name="txtTgt" #txtTgt='ngModel' spellcheck="false"
                        style="height: 400px; width: 600px;"></textarea>            
            
            </p-tabpanel>

            <!--<p-tabpanel [value]="4" *ngIf="isRunning">-->
            <p-tabpanel [value]="4">
              <!-- <div #menuRun id="menuRun" layout="row" class="div-table-row"> -->
                <!-- Controls -->
                <!-- <p-menubar [model]="itemsRun" [style]="{height:'48px'}"/> -->
              <!-- </div> -->
              <div>
              <div id="runOutput" style="font-family: Arial, Helvetica, sans-serif; font-size: 10pt; overflow: scroll; padding: 3pt;"></div>
              </div>
            </p-tabpanel>  
          </p-tabpanels>
        </p-tabs>
        </div>
        </ng-template>
        <ng-template #panel>
          <div id="diag" style="font-family: Arial, Helvetica, sans-serif; font-size: 8pt; overflow: scroll; padding: 3pt; margin: 16px;"></div>
        </ng-template>
    </p-splitter>
    </div>

</div>

<div id="graph" style="position:absolute; top: 50px; left: 1000px; width: 400px; height: 400px; visibility: hidden; z-index: 0;">
  <svg #myGraph id="myGraph" width="400px" height="400px" style="border: 1px solid #000; background-color: white;">
      <style>
        .smallTxt {
          font: italic 2px sans-serif;
        }
      </style>
  </svg>
</div>

<app-prefs></app-prefs>

<p-dialog header="Start with behavior" [modal]="true" [(visible)]="dlgStartBeh" [style]="{ width: '25rem' }">
    <div class="flex items-center mb-4">
        <label for="start_beh" class="font-semibold w-24">Behavior name: </label>
        <input #start_beh id="start_beh" class="flex-auto" autocomplete="off" />
    </div>
    <div class="flex justify-end">
        <p-button label="Cancel" severity="secondary" (click)="startBehCancel();" />
        <p-button label="Save" (click)="startBehConfirm();" />
    </div>
</p-dialog>

<p-dialog header="Add graph" [modal]="true" [(visible)]="dlgAddGraph">
    <div class="flex items-center mb-4">
        <label for="gr_name" class="font-semibold w-24">Graph name: </label>
        <input #gr_name type="text" id="gr_name" class="flex-auto" autocomplete="off" />
        <input #gr_color type="color" id="gr_color" class="flex-auto" />
    </div>
    <div class="flex items-center mb-4">
        <label for="gr_X" class="font-semibold w-24">X-axis parameter: </label>
        <input type="text" #gr_X id="gr_X" class="flex-auto" autocomplete="off" />
        <br />
        <label for="gr_Y" class="font-semibold w-24">Y-axis parameter: </label>
        <input type="text" #gr_Y id="gr_Y" class="flex-auto" autocomplete="off" />
    </div>
    <hr />  
    <div class="flex justify-end">
        <p-button label="Cancel" severity="secondary" (click)="addGraphCancel();" />
        <p-button label="OK" (click)="addGraphConfirm();" />
    </div>
</p-dialog>


<!-- MsgBox div -->
<div id="MsgBox" class="Absolute-Center" style="visibility: hidden;">
  <table cellpadding="2" style="border: none;">
    <tr><td id="msg_hdr"></td></tr>
    <tr><td id="msg_msg"></td></tr>
    <tr><td style="align-items: center"><input type="button" value="OK" onclick="document.getElementById('MsgBox').style.visibility='hidden'" /></td></tr>
  </table>
</div>

</main>

<router-outlet />
