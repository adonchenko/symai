<style>
  main {
    width: 100%;
    min-height: 100%;
    display: flex;
    font-family: Arial, Helvetica, sans-serif; 
    /*
    justify-content: center;
    align-items: center;
    */
    padding: 1rem;
    /*box-sizing: inherit;*/
    position: relative;
  }

  .div-table {
    display: table;         
    width: 100%;      
    height: 100%;   
    background-color: #eee;         
    border: none;         
    border-spacing: 0px; /* cellspacing:poor IE support for  this */
  }

  .div-table-row {
    display: table-row;
    width: auto;
    clear: both;
  }

  .Absolute-Center {
    width: 50%;
    height: 50%;
    overflow: auto;
    margin: auto;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0; 
    min-width: 20%;
    max-width: 80%;
    min-height: 20%;
    max-height: 80%;
    resize: both;
    z-index: 9999;
    border: 2px solid grey;
  }  
  
</style>

<main class="main"><div class="div-table" style="overflow:visible;">

    <div id="menuBar" class="div-table-row"  style="overflow:visible;">
      <p-menubar [model]="items" [style]="{height:'36px'}"/>
      <!--
      <input type="button" id="envLoader" (click)="doLoadEnv(true)" style="visibility: hidden;" />
      <input type="button" id="behLoader" (click)="doLoadBeh(true)" style="visibility: hidden;" />
      <input type="button" id="actLoader" (click)="doLoadAct(true)" style="visibility: hidden;" />
      <input type="button" id="tgtLoader" (click)="doLoadTgt(true)" style="visibility: hidden;" />

      <input type="hidden" id="hiddenRefresh" value="" style="visibility: hidden;" />
      <input type="button" id="cmdRefresh" style="visibility: hidden; width: 0px; height: 0px; overflow: hidden;" onclick="do_refresh();" />
      -->
    </div>
    <div class="div-table-row" style="margin: 2px;">&nbsp;</div>
    <div id="workspace" class="div-table-row">
      <p-splitter id="splitter"
                  [style]="{ height: '700px', width: '100%' }" class="mb-8" layout="vertical" 
                  [minSizes]="[30,10]" [panelSizes]="[75,25]"
                  (onResizeEnd)="onSplitterResizeEnd($event)">

        
        <ng-template #panel>
        <div id="theTabs">
        <p-tabs scrollable [(value)]="tabVal" (valueChange)="tabChange();"  onchange="adjustSizes();">
          <p-tablist>
              <p-tab [value]="0">Environment</p-tab>
              <p-tab [value]="1">Behavior</p-tab>
              <p-tab [value]="2">Actions</p-tab>
              <p-tab [value]="3">Property</p-tab>
              <p-tab [value]="4">Execution</p-tab>
          </p-tablist>

          <p-tabpanels>
            <p-tabpanel [value]="0">

              <div>
                <input type="file" #fileEnv maxFileSize="100000000" 
                      (onSelect)="handleEnvFileInput($event)" 
                      (change)="handleEnvFileInput($event)" 
                      id="fileEnv" name="fileEnv" style="height: 24px;" />
              </div>
              <textarea id="txtEnv" [(ngModel)]='cntEnv' name="txtEnv" #txtEnv='ngModel' spellcheck="false"
                        style="height: 400px; width: 600px;"></textarea>            
            
            </p-tabpanel>

            <p-tabpanel [value]="1">

              <div>
                <input type="file" #fileBeh maxFileSize="100000000" 
                      (onSelect)="handleBehFileInput($event)" 
                      (change)="handleBehFileInput($event)" 
                      id="fileBeh" name="fileBeh" style="height: 24px;" />
              </div>
              <textarea id="txtBeh" [(ngModel)]='cntBeh' name="txtBeh" #txtBeh='ngModel' spellcheck="false"
                        style="height: 400px; width: 600px;"></textarea>            
            
            </p-tabpanel>

            <p-tabpanel [value]="2">

              <div>
                <input type="file" #fileAct maxFileSize="100000000" 
                      (onSelect)="handleActFileInput($event)" 
                      (change)="handleActFileInput($event)" 
                      id="fileAct" name="fileAct" style="height: 24px" />
              </div>
              <textarea id="txtAct" [(ngModel)]='cntAct' name="txtAct" #txtAct='ngModel' spellcheck="false"
                        style="height: 400px; width: 600px;"></textarea>            
            
            </p-tabpanel>

            <p-tabpanel [value]="3">

              <div>
                <input type="file" #fileTgt maxFileSize="100000000" 
                      (onSelect)="handleTgtFileInput($event)" 
                      (change)="handleTgtFileInput($event)" 
                      id="fileTgt" name="fileTgt" style="height: 24px;" />
              </div>
              <textarea id="txtTgt" [(ngModel)]='cntTgt' name="txtTgt" #txtTgt='ngModel' spellcheck="false"
                        style="height: 400px; width: 600px;"></textarea>            
            
            </p-tabpanel>

            <!--<p-tabpanel [value]="4" *ngIf="isRunning">-->
            <p-tabpanel [value]="4"  scrollable>
              <!-- <div #menuRun id="menuRun" layout="row" class="div-table-row"> -->
                <!-- Controls -->
                <!-- <p-menubar [model]="itemsRun" [style]="{height:'48px'}"/> -->
              <!-- </div> -->
              <div id="runOut" class="scrollable-content">
                TRACE:
                <div id="trcOutput" #trcOutput class="div-table-row" style="padding: 32px; border-bottom: #000;"></div>
                ENVIRONMENT:
                <div id="envOutput" #envOutput class="div-table-row" style="padding: 32px; border-bottom: #000;"></div>
                <div id="runOutput" class="div-table-row"></div>
              </div>
            </p-tabpanel>  
          </p-tabpanels>
        </p-tabs>
        </div>
        </ng-template>
        <ng-template #panel scrollable>
          <div id="diag" class="scrollable-diag"></div>
        </ng-template>
    </p-splitter>
    </div>

</div>

<div id="graph" style="position:absolute; top: 50px; left: 1000px; width: 400px; height: 400px; visibility: hidden; z-index: 0;">
  <svg #myGraph id="myGraph" width="400px" height="400px" style="border: 1px solid #000; background-color: white;">
      <style>
        .smallTxt {
          font: italic 2px sans-serif;
        }
      </style>
  </svg>
</div>

<app-prefs></app-prefs>

<p-dialog header="Start with behavior" [modal]="true" [(visible)]="dlgStartBeh" [style]="{ width: '25rem' }">
    <div class="flex items-center mb-4">
        <label for="start_beh" class="font-semibold w-24">Behavior name: </label>
        <input #start_beh id="start_beh" class="flex-auto" autocomplete="off" />
    </div>
    <div class="flex justify-end">
        <p-button label="Cancel" severity="secondary" (click)="startBehCancel();" />
        <p-button label="Save" (click)="startBehConfirm();" />
    </div>
</p-dialog>

<p-dialog header="Add graph" [modal]="true" [(visible)]="dlgAddGraph">
    <div class="flex items-center mb-4">
        <label for="gr_name" class="font-semibold w-24">Graph name: </label>
        <input #gr_name type="text" id="gr_name" class="flex-auto" autocomplete="off" />&nbsp;
        <input #gr_color type="color" id="gr_color" class="flex-auto" />
    </div>
    <div class="flex items-center mb-4">
        <label for="gr_X" class="font-semibold w-24">X-axis parameter: </label>
        <input type="text" #gr_X id="gr_X" class="flex-auto" autocomplete="off" />
        <br />
        <label for="gr_Y" class="font-semibold w-24">Y-axis parameter: </label>
        <input type="text" #gr_Y id="gr_Y" class="flex-auto" autocomplete="off" />
        <br />
        <label for="gr_Pts" class="font-semibold w-24">Point labels: </label>
        <input type="checkbox" #gr_Lbl id="gr_Lbl" class="flex-auto" checked />
    </div>
    <hr />  
    <div class="flex justify-end">
        <p-button label="Cancel" severity="secondary" (click)="addGraphCancel();" />
        <p-button label="OK" (click)="addGraphConfirm();" />
    </div>
</p-dialog>

<p-dialog header="Graph size" [modal]="true" [(visible)]="dlgGraphSize">
    <div class="flex items-center mb-4">
        <label for="gr_W" class="font-semibold w-24">Width: </label>
        <input type="number" #gr_W id="gr_W" class="flex-auto" [(value)]="dlgGraphSizeX" min="200" />
        <br />
        <label for="gr_H" class="font-semibold w-24">Height: </label>
        <input type="number" #gr_H id="gr_H" class="flex-auto" [(value)]="dlgGraphSizeY" min="200" />
    </div>
    <hr />  
    <div class="flex justify-end">
        <p-button label="Cancel" severity="secondary" (click)="sizeGraphCancel();" />
        <p-button label="OK" (click)="sizeGraphConfirm();" />
    </div>
</p-dialog>

<p-dialog header="Model Re-enter count" [modal]="true" [(visible)]="dlgReEnter" [style]="{ width: '30rem' }">
    <div class="flex items-center mb-4">
        <label for="reenter_count1" class="font-semibold w-24">Re-enter count:&nbsp;</label>
        <input type="number" #reenter_count1 id="reenter_count1" [(value)]="dlgReEnterCountVal" class="flex-auto" autocomplete="off" />
        &nbsp;
        <label for="reenter_count_flush1" class="font-semibold w-24">Flush:&nbsp;</label>
        <input type="checkbox" #reenter_count_flush1 id="reenter_count_flush1" [(checked)]="dlgReEnterCountFlush" class="flex-auto" />
    </div>
    <div class="flex justify-end">
        <p-button label="Cancel" severity="secondary" (click)="dlgReEnterCancel();" />
        <p-button label="Save" (click)="dlgReEnterConfirm();" />
    </div>
</p-dialog>

<p-dialog header="Max models" [modal]="true" [(visible)]="dlgMaxModels" [style]="{ width: '30rem' }">
    <div class="flex items-center mb-4">
        <label for="max_models1" class="font-semibold w-24">Max Models: </label>
        <input type="number" id="max_models1" class="flex-auto" [(value)]="dlgMaxModelsVal" autocomplete="off" />
        &nbsp;
        <label for="max_models_flush1" class="font-semibold w-24">Flush: </label>
        <input type="checkbox" id="max_models_flush1" [(checked)]="dlgMaxModelsFlush" class="flex-auto" />
    </div>
    <div class="flex justify-end">
        <p-button label="Cancel" severity="secondary" (click)="dlgMaxModelsCancel();" />
        <p-button label="Save" (click)="dlgMaxModelsConfirm();" />
    </div>
</p-dialog>



<!-- MsgBox div -->
<p-dialog header="Message" [modal]="true" [(visible)]="showMsgBox" [style]="{ width: '25rem' }">
<!-- <div id="MsgBox" class="Absolute-Center" style="visibility: hidden;"> -->
  <table cellpadding="2" style="border: none;">
    <tr><td id="msg_hdr"></td></tr>
    <tr><td id="msg_msg"></td></tr>
    <tr><td style="align-items: center"><!-- <input type="button" value="OK" onclick="document.getElementById('MsgBox').style.visibility='hidden'" /> -->
      <p-button label="OK" (click)="showMsgBox=false;" />
    </td></tr>
  </table>
<!-- </div> -->
</p-dialog>


</main>

<router-outlet />
