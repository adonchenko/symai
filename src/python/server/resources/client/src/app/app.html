<style>
  :host {
    --bright-blue: oklch(51.01% 0.274 263.83);
    --electric-violet: oklch(53.18% 0.28 296.97);
    --french-violet: oklch(47.66% 0.246 305.88);
    --vivid-pink: oklch(69.02% 0.277 332.77);
    --hot-red: oklch(61.42% 0.238 15.34);
    --orange-red: oklch(63.32% 0.24 31.68);

    --gray-900: oklch(19.37% 0.006 300.98);
    --gray-700: oklch(36.98% 0.014 302.71);
    --gray-400: oklch(70.9% 0.015 304.04);

    --red-to-pink-to-purple-vertical-gradient: linear-gradient(
      180deg,
      var(--orange-red) 0%,
      var(--vivid-pink) 50%,
      var(--electric-violet) 100%
    );

    --red-to-pink-to-purple-horizontal-gradient: linear-gradient(
      90deg,
      var(--orange-red) 0%,
      var(--vivid-pink) 50%,
      var(--electric-violet) 100%
    );

    --pill-accent: var(--bright-blue);

    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  h1 {
    font-size: 3.125rem;
    color: var(--gray-900);
    font-weight: 500;
    line-height: 100%;
    letter-spacing: -0.125rem;
    margin: 0;
    font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
  }

  p {
    margin: 0;
    color: var(--gray-700);
  }

  main {
    width: 100%;
    min-height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    box-sizing: inherit;
    position: relative;
  }

  .div-table {
    display: table;         
    width: 100%;         
    background-color: #eee;         
    border: none;         
    border-spacing: 0px; /* cellspacing:poor IE support for  this */
  }

  .div-table-row {
    display: table-row;
    width: auto;
    clear: both;
  }

  .angular-logo {
    max-width: 9.2rem;
  }

  .content {
    display: flex;
    justify-content: space-around;
    width: 100%;
    max-width: 700px;
    margin-bottom: 3rem;
  }

  .content h1 {
    margin-top: 1.75rem;
  }

  .content p {
    margin-top: 1.5rem;
  }

  .divider {
    width: 1px;
    background: var(--red-to-pink-to-purple-vertical-gradient);
    margin-inline: 0.5rem;
  }

  .pill-group {
    display: flex;
    flex-direction: column;
    align-items: start;
    flex-wrap: wrap;
    gap: 1.25rem;
  }

  .pill {
    display: flex;
    align-items: center;
    --pill-accent: var(--bright-blue);
    background: color-mix(in srgb, var(--pill-accent) 5%, transparent);
    color: var(--pill-accent);
    padding-inline: 0.75rem;
    padding-block: 0.375rem;
    border-radius: 2.75rem;
    border: 0;
    transition: background 0.3s ease;
    font-family: var(--inter-font);
    font-size: 0.875rem;
    font-style: normal;
    font-weight: 500;
    line-height: 1.4rem;
    letter-spacing: -0.00875rem;
    text-decoration: none;
    white-space: nowrap;
  }

  .pill:hover {
    background: color-mix(in srgb, var(--pill-accent) 15%, transparent);
  }

  .pill-group .pill:nth-child(6n + 1) {
    --pill-accent: var(--bright-blue);
  }
  .pill-group .pill:nth-child(6n + 2) {
    --pill-accent: var(--electric-violet);
  }
  .pill-group .pill:nth-child(6n + 3) {
    --pill-accent: var(--french-violet);
  }

  .pill-group .pill:nth-child(6n + 4),
  .pill-group .pill:nth-child(6n + 5),
  .pill-group .pill:nth-child(6n + 6) {
    --pill-accent: var(--hot-red);
  }

  .pill-group svg {
    margin-inline-start: 0.25rem;
  }

  .divider {
    height: 1px;
    width: 100%;
    background: var(--red-to-pink-to-purple-horizontal-gradient);
    margin-block: 1.5rem;
  }

  .Absolute-Center {
    width: 50%;
    height: 50%;
    overflow: auto;
    margin: auto;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0; 
    min-width: 20%;
    max-width: 80%;
    min-height: 20%;
    max-height: 80%;
    resize: both;
    z-index: 9999;
    border: 2px solid grey;
  }  

  
</style>

<main class="main"><div class="div-table" styly="overflow:auto;">

    <div #menuBar id="menuBar" layout="row" class="div-table-row">
      <p-menubar [model]="items" [style]="{height:'48px'}"/>
      <!--
      <input type="button" id="envLoader" (click)="doLoadEnv(true)" style="visibility: hidden;" />
      <input type="button" id="behLoader" (click)="doLoadBeh(true)" style="visibility: hidden;" />
      <input type="button" id="actLoader" (click)="doLoadAct(true)" style="visibility: hidden;" />
      <input type="button" id="tgtLoader" (click)="doLoadTgt(true)" style="visibility: hidden;" />
      -->
      <input type="hidden" id="hiddenRefresh" value="" style="visibility: hidden;" />
      <input type="button" id="cmdRefresh" style="visibility: hidden; width: 0px; height: 0px; overflow: hidden;" onclick="do_refresh();" />
    </div>

    <div id="workspace" id="workspace" class="div-table-row">
      <p-splitter id="splitter"
                  [style]="{ height: '700px', width: '100%' }" class="mb-8" layout="vertical" 
                  [minSizes]="[30,10]" [panelSizes]="[75,25]"
                  (onResizeEnd)="onSplitterResizeEnd($event)">

        <ng-template #panel>
        <p-tabs [(value)]="tabVal" onchange="adjustSizes();">
          <p-tablist>
              <p-tab [value]="0">Environment</p-tab>
              <p-tab [value]="1">Behavior</p-tab>
              <p-tab [value]="2">Actions</p-tab>
              <p-tab [value]="3">Property</p-tab>
              <p-tab [value]="4">Execution</p-tab>
          </p-tablist>

          <p-tabpanels>
            <p-tabpanel #tabViewEnv [value]="0" onresize="setTextareaSizes('txtEnv');">

              <div>
                <input type="file" #fileEnv maxFileSize="100000000" 
                      (onSelect)="handleEnvFileInput($event)" 
                      (change)="handleEnvFileInput($event)" 
                      id="fileEnv" name="fileEnv" style="height: 24px;" />
              </div>
              <textarea id="txtEnv" [(ngModel)]='cntEnv' name="txtEnv" #txtEnv='ngModel' spellcheck="false"
                        style="height: 400px; width: 600px;"></textarea>            
            
            </p-tabpanel>

            <p-tabpanel [value]="1" onresize="setTextareaSizes('txtBeh');">

              <div>
                <input type="file" #fileBeh maxFileSize="100000000" 
                      (onSelect)="handleBehFileInput($event)" 
                      (change)="handleBehFileInput($event)" 
                      id="fileBeh" name="fileBeh" style="height: 24px;" />
              </div>
              <textarea id="txtBeh" [(ngModel)]='cntBeh' name="txtBeh" #txtBeh='ngModel' spellcheck="false"
                        style="height: 400px; width: 600px;"></textarea>            
            
            </p-tabpanel>

            <p-tabpanel [value]="2" onresize="setTextareaSizes('txtAct');">

              <div>
                <input type="file" #fileAct maxFileSize="100000000" 
                      (onSelect)="handleActFileInput($event)" 
                      (change)="handleActFileInput($event)" 
                      id="fileAct" name="fileAct" style="height: 24px" />
              </div>
              <textarea id="txtAct" [(ngModel)]='cntAct' name="txtAct" #txtAct='ngModel' spellcheck="false"
                        style="height: 400px; width: 600px;"></textarea>            
            
            </p-tabpanel>

            <p-tabpanel [value]="3" onresize="setTextareaSizes('txtTgt');">

              <div>
                <input type="file" #fileTgt maxFileSize="100000000" 
                      (onSelect)="handleTgtFileInput($event)" 
                      (change)="handleTgtFileInput($event)" 
                      id="fileTgt" name="fileTgt" style="height: 24px;" />
              </div>
              <textarea id="txtTgt" [(ngModel)]='cntTgt' name="txtTgt" #txtTgt='ngModel' spellcheck="false"
                        style="height: 400px; width: 600px;"></textarea>            
            
            </p-tabpanel>

            <!--<p-tabpanel [value]="4" *ngIf="isRunning">-->
            <p-tabpanel [value]="4">
              <!-- <div #menuRun id="menuRun" layout="row" class="div-table-row"> -->
                <!-- Controls -->
                <!-- <p-menubar [model]="itemsRun" [style]="{height:'48px'}"/> -->
              <!-- </div> -->
              <div>
              <div #runOutput id="runOutput" style="overflow: auto; font-family: Arial, Helvetica, sans-serif; font-size: 10pt; overflow: auto;"></div>
              </div>
            </p-tabpanel>  
          </p-tabpanels>
        </p-tabs>

            <!--</div>-->
        </ng-template>
        <ng-template #panel>
          <table [border]="0" [cellSpacing]="0" [cellPadding]="2"><tr>
            <td><div #diag id="diag" style="font-family: Arial, Helvetica, sans-serif; font-size: 8pt; overflow: scroll;"></div></td>
            <td style="width:420px; height: 200px;"></td>
              <!--Panel 2-->
          </tr></table>
        </ng-template>
    </p-splitter>
    </div>

</div>

<div id="graph" style="position:absolute; top: 50px; left: 1000px; width: 400px; height: 400px; visibility: hidden; z-index: 0;">
  <svg #myGraph id="myGraph" width="400px" height="400px" style="border: 1px solid #000; background-color: white;">
      <style>
        .smallTxt {
          font: italic 2px sans-serif;
        }
      </style>
  </svg>
</div>

<app-prefs></app-prefs>

<p-dialog header="Start with behavior" [modal]="true" [(visible)]="dlgStartBeh" [style]="{ width: '25rem' }">
    <div class="flex items-center mb-4">
        <label for="start_beh" class="font-semibold w-24">Behavior name: </label>
        <input #start_beh id="start_beh" class="flex-auto" autocomplete="off" />
    </div>
    <div class="flex justify-end">
        <p-button label="Cancel" severity="secondary" (click)="startBehCancel();" />
        <p-button label="Save" (click)="startBehConfirm();" />
    </div>
</p-dialog>

<p-dialog header="Add graph" [modal]="true" [(visible)]="dlgAddGraph">
    <div class="flex items-center mb-4">
        <label for="gr_name" class="font-semibold w-24">Graph name: </label>
        <input #gr_name type="text" id="gr_name" class="flex-auto" autocomplete="off" />
        <input #gr_color type="color" id="gr_color" class="flex-auto" />
    </div>
    <div class="flex items-center mb-4">
        <label for="gr_X" class="font-semibold w-24">X-axis parameter: </label>
        <input type="text" #gr_X id="gr_X" class="flex-auto" autocomplete="off" />
        <br />
        <label for="gr_Y" class="font-semibold w-24">Y-axis parameter: </label>
        <input type="text" #gr_Y id="gr_Y" class="flex-auto" autocomplete="off" />
    </div>
    <hr />  
    <div class="flex justify-end">
        <p-button label="Cancel" severity="secondary" (click)="addGraphCancel();" />
        <p-button label="OK" (click)="addGraphConfirm();" />
    </div>
</p-dialog>


<!-- MsgBox div -->
<div id="MsgBox" class="Absolute-Center" style="visibility: hidden;">
  <table cellpadding="2" style="border: none;">
    <tr><td id="msg_hdr"></td></tr>
    <tr><td id="msg_msg"></td></tr>
    <tr><td style="align-items: center"><input type="button" value="OK" onclick="document.getElementById('MsgBox').style.visibility='hidden'" /></td></tr>
  </table>
</div>

</main>
