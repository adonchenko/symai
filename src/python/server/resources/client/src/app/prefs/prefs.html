<p-dialog header="SymAI Preferences" [modal]="true" [(visible)]="dlgVisible" [style]="{ width: '40rem' }" appendTo="body">
    <!--<div class="flex items-center gap-4 mb-4">-->
    <table [border]="0" [cellPadding]="3" [cellSpacing]="3">
            <tr><td>
        <label for="solverName" class="font-semibold w-24" style="width : '128px'">Solver to be used: </label>
            </td><td>
        <p-select [options]="solvers" [(ngModel)]="selectedSolver" id="solverName"
                  placeholder="Select a Solver" [editable]="false" optionLabel="label" class="w-full md:w-56" />
            </td><td>
        <label for="flushSelSolver" class="font-semibold w-24" style="width : '128px'">Use for all models </label>
            </td><td>
        <p-checkbox id="flushSelSolver" [(ngModel)]="flushSelSolver" [binary]="true" />
            </td></tr>
    <!--</div>
    <div class="flex items-center gap-4 mb-8">-->
            <tr><td>
        <label for="useAI" class="font-semibold w-24" style="width : '128px'">Use AI: </label>
            </td><td>
        <p-toggleswitch [(ngModel)]="flagUseAI" />
            </td><td>
        <label for="flushUseAI" class="font-semibold w-24" style="width : '128px'">Use for all models </label>
            </td><td>
        <p-checkbox id="flushUseAI" [(ngModel)]="flushUseAI" [binary]="true" />
            </td></tr>
    <!--</div>
    <div class="flex items-center gap-4 mb-8">-->
            <tr><td>
        <label for="maxModels" class="font-semibold w-24" style="width : '128px'">Max. models to run:</label>
            </td><td>
        <p-inputnumber id="maxModels" [(ngModel)]="maxModels" inputId="minmax" mode="decimal" [min]="1" [max]="5" />
            </td><td>
        <label for="flushMaxModels" class="font-semibold w-24" style="width : '128px'">Use for all models </label>
            </td><td>
        <p-checkbox id="flushMaxModels" [(ngModel)]="flushMaxModels" [binary]="true" />
            </td></tr>
        
            <tr><td>
        <label for="reenterCount" class="font-semibold w-24" style="width : '128px'">Max. reenters:</label>
            </td><td>
        <p-inputnumber id="reenterCount" [(ngModel)]="reenterCount" inputId="minmax" mode="decimal" [min]="1" [max]="5" />
            </td><td>
        <label for="flushReenterCount" class="font-semibold w-24" style="width : '128px'">Use for all models </label>
            </td><td>
        <p-checkbox id="flushReenterCount" [(ngModel)]="flushReenterCount" [binary]="true" />
            </td></tr>
    <!--</div>-->
    </table>
    <ng-template #footer>
        <p-button label="Cancel" [text]="true" severity="secondary" (click)="dlgVisible = false" />
        <p-button label="Save" [outlined]="true" severity="secondary" (click)="confirmPrefs($event)" />
    </ng-template>
</p-dialog>
