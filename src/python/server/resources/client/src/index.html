<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>App2</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
<script language="JavaScript">

function getItemText(id) {
    const inp = document.getElementById(id);
    if(inp)
      return inp.value;
    return "";
}  

function adjustSizes() {
    console.log("AdjustSizes");
    if( window.myApp ) {
        var idx = window.myApp.getTabValue();
        var id="";
        switch(idx) {
          case 0: id="txtEnv"; break;
          case 1: id="txtBeh"; break;
          case 2: id="txtAct"; break;
          case 3: id="txtTgt"; break;
          default: return;
        }
        setTextareaSizes(id);
    }
}  

var splitterTop = 75.;
var splitterBottom = 25.;

function recalcPaneSizes(top,bottom) {
    var w = window.innerWidth;
    var h = window.innerHeight-36;

    splitterTop = top;
    splitterBottom = bottom;

    var ht = Math.round(h*splitterTop/100.);
    var hb = Math.round(h*splitterBottom/100.);
    while(ht+hb+4 >= h) {
      ht--;
      hb--;
    }

    //console.log("Window: "  + w + " x " + h );
    var diagPanel =  document.getElementById("diag");
    if( diagPanel ) {
      //diagPanel.style.height = String(hb) + 'px';
      diagPanel.style.overflow = 'scroll';
      //console.log ("Diag height: " + diagPanel.style.height);
    }
    var theTabs =  document.getElementById("theTabs");
    if( theTabs ) {
      theTabs.style.height = String(ht) + 'px';
      //console.log ("Tabs height: " + theTabs.style.height);
    }

    diag( "Window height: " + String(h));
    diag("Top: " + String(ht) + ", Bottom: " + String(hb));
    diag("Tabs height: " + theTabs.style.height);
    adjustSizes();
}

function setTextareaSizes( taId ) {
    const inp = document.getElementById(taId);
    if(inp) {
      var w = window.innerWidth;
      var h = window.innerHeight-36;

      //console.log("inpParent is" + inpParent.tagName + 
      //            ", sizeClient: " + inpParent.clientWidth + " x " + inpParent.clientHeight +
      //            ", size: " + inpParent.width + " x " + inpParent.height);
      var ht = Math.round(h*splitterTop/100.);
      var hb = Math.round(h*splitterBottom/100.);
      while(ht+hb+4 >= h) {
        ht--;
        hb--;
      }

      inp.style.top = '50px';
      inp.style.left = '4px';
      inp.style.width = String(w-32) + 'px';
      ht -= 256;
      inp.style.height = String(ht) + 'px';

      diag(" ---------- textarea calculated height " + ht);
    }
    else
      console.log("Element not found: " + taId);
}

function wsWidth() {
  return window.innerWidth;
} 

function wsHeight() {
  return window.innerHeight-36; //48;
}

function setSizes() {
  var w = window.innerWidth;
  var h = window.innerHeight;
  const menuBar = document.getElementById("menuBar");
  const ws = document.getElementById("workspace");
  //diag("SET SIZES, window: "  + w + " x " + h );
  //diag("SET SIZES, document: "  + document.body.width + " x " + document.body.height );
  if(ws) {
    ws.style.width= w + 'px'; 
    //ws.width = w;
    if(menuBar && menuBar.height) {
      //ws.height = h - menuBar.height;
      ws.style.height = (h-menuBar.height) + 'px';
      h -= menuBar.height;
      //console.log("           workspace(1): "  + ws.style.height );
    }
    else {
      //ws.height = h - 48;
      ws.style.height = (h-36) + 'px';
      h -= 36;
      //console.log("           workspace(2): "  + ws.style.height );
    }
    //diag("           workspace: "  + ws.style.width + " x " + ws.style.height );

    var ht = Math.round(h*splitterTop/100.);
    var hb = Math.round(h*splitterBottom/100.);
    while(ht+hb+4 >= h) {
      ht--;
      hb--;
    }

    var diagPanel =  document.getElementById("diag");
    if( diagPanel ) {
      diagPanel.style.width = (w - 4) + 'px';
      //console.log("           Diag width: "  + diagPanel.style.width );
      //diagPanel.style.height =  String(hb)+'px'; //Math.round(h*splitterBottom/100.) + 'px';
      //console.log("           Diag height: "  + diagPanel.style.height );

      const rc = diagPanel.getBoundingClientRect();
      //console.log("           Diag rect at: ("  + rc.left + "," + rc.top + ")" );
      if( rc.left < 0 )
        diagPanel.style.left = '2px';

      //diagPanel.style.position = 'relative';
      diagPanel.style.overflow = 'scroll';
      diagPanel.style.margin = '16px';
      diagPanel.style.padding = '3pt';
      //diag("           diagPanel: "  + diagPanel.style.width + " x " + diagPanel.style.height );
    }  
    
    var theTabs =  document.getElementById("theTabs");
    if( theTabs ) {
      theTabs.style.width = (w-4) + 'px';
      //console.log("           Tabs width: "  + theTabs.style.width );
      theTabs.style.height = String(ht)+'px'; //Math.round(h*splitterTop/100.) + 'px';
      //console.log("           Tabs height: "  + theTabs.style.height );

      const rc = theTabs.getBoundingClientRect();
      //console.log("           Tabs rect at: ("  + rc.left + "," + rc.top + ")" );
      if( rc.left < 0 )
        theTabs.style.left = '2px';

      //theTabs.style.position = 'relative';
      theTabs.style.padding = '3pt';
      //diag("           tabs: "  + theTabs.style.width + " x " + theTabs.style.height );
    }
    adjustSizes();
  }
  else
    console.log("Workspace not found");
}

function refreshItem(id) {
  console.log("refreshItem: " + id);
  var element = document.getElementById(id);
  if(element) {
    //var content = element.innerHTML;
    //element.innerHTML= content; 
    var n = document.createTextNode(' ');
    var disp = element.style.display;  // don't worry about previous display style
    element.appendChild(n);
    element.style.display = 'none';

    setTimeout(function(){
        n.parentNode.removeChild(n);
        element.style.display = disp;
      },2);
    }
}

function diag(msg) {
    var element = document.getElementById("diag");
    var n = document.createTextNode(msg);
    if(element) {
      element.appendChild(n);

      var br = document.createElement("br");  
      element.append(br)

      element.scrollTop = element.scrollHeight;
      element.lastElementChild.scrollIntoView(false);
    }
  }

function output(msg) {
    var element = document.getElementById("runOutput");
    if(element) {
      var n = document.createTextNode(msg);
      element.appendChild(n);

      var br = document.createElement("br");  
      element.append(br)

      element.scrollTop = element.scrollHeight;
      element.lastElementChild.scrollIntoView(false);
    }
}

function do_refresh() {
    var element = document.getElementById("hiddenRefresh");
    if( element )  // should be DIV
      refreshItem( element.value );
}

function clickHiddenRefresh(arg) {
    var element = document.getElementById("hiddenRefresh");
    var elemCmd = document.getElementById("cmdRefresh");
    if( element && elemCmd ) { // should be DIV
      element.value = arg;
      elemCmd.click();
    }
}

var mousePosition;
var offset = [0,0];
var div;
var isDown = false;

function setGraphMoveable() {
  div = document.getElementById('graph');
  if(!div) {
    console.log("ERROR: Element 'graph' not found");
    return;
  }   
  div.addEventListener('mousedown', function(e) {
        isDown = true;
        offset = [
            div.offsetLeft - e.clientX,
            div.offsetTop - e.clientY
        ];
    }, true);

  document.addEventListener('mouseup', function() {
      isDown = false;
  }, true);

  document.addEventListener('mousemove', function(event) {
      event.preventDefault();
      if (isDown) {
          mousePosition = {
              x : event.clientX,
              y : event.clientY
          };
          div.style.left = (mousePosition.x + offset[0]) + 'px';
          div.style.top  = (mousePosition.y + offset[1]) + 'px';
      }
  }, true);  
}

function setInit() {
  setSizes();
  window.addEventListener('resize', function(event) { 
      //event.preventDefault();
      setSizes();
  });
  setGraphMoveable();
}

</script>
</head>
<body onload="setInit();">

</body>
