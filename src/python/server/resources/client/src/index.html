<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>App2</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
<script language="JavaScript">

function getItemText(id) {
    const inp = document.getElementById(id);
    if(inp)
      return inp.value;
    return "";
}  

function adjustSizes() {
    console.log("AdjustSizes");
    if( window.myApp ) {
        var idx = window.myApp.getTabValue();
        var id="";
        switch(idx) {
          case 0: id="txtEnv"; break;
          case 1: id="txtBeh"; break;
          case 2: id="txtAct"; break;
          case 3: id="txtTgt"; break;
        }
        setTextareaSizes(id);
    }
}  

function setTextareaSizes( taId ) {
    const inp = document.getElementById(taId);
    //console.log("setTextareaSizes for "+ taId);
    if(inp) {
      var inpParent = inp.parentElement;

      while( inpParent && inpParent.width === undefined)
        inpParent = inpParent.parentElement;
      //console.log("inpParent is" + inpParent.tagName + 
      //            ", sizeClient: " + inpParent.clientWidth + " x " + inpParent.clientHeight +
      //            ", size: " + inpParent.width + " x " + inpParent.height);

      inp.style.top = '50px';
      inp.style.left = '4px';
      inp.style.width = String(inpParent.width-24) + "px";
      inp.width = String(inpParent.width-24) + "px";
      
      if( window.myApp ) {
        //console.log("SplitterTop:" + window.myApp.getSplitterTop());
        var t1 =  Math.trunc((inpParent.height * Math.trunc(window.myApp.getSplitterTop()))  / 100) - 36;
        inp.style.height = String(t1) + "px";
        inp.height =  String(t1) + "px";

        const diagPanel =  document.getElementById("diag");
        if(diagPanel) {
          var diagParent = diagPanel.parentElement;

          while( diagParent && diagParent.clientHeight === undefined)
            diagParent = diagParent.parentElement;
            
            diagPanel.style.height = diagParent.clientHeight + 'px';
            console.log("setTextareaSizes-diagHeight="+diagPanel.style.height);
            //inp.style.width = String(inpParent.width-24) + "px";
        }

      }            
      else {
        console.log("theApp not accessible");              
        //inpEnv.style.height = String(inpEnvParent.clientHeight-256) + "px";
        //inpEnv.height =  String(inpEnvParent.clientHeight-256) + "px";
      }
      //console.log("Element sizes: " + inp.width + " x " + inp.height);
    }
    else
      console.log("Element not found: " + taId);
}

function wsWidth(ws) {
  return window.innerWidth;
} 

function wsHeight(ws) {
  return window.innerHeight-48;
}

function setSizes() {
  var w = window.innerWidth;
  var h = window.innerHeight;
  const menuBar = document.getElementById("menuBar");
  const ws = document.getElementById("workspace");
  //console.log("SET SIZES, window: "  + w + " x " + h );
  if(ws) {
    ws.width = w;
    if(menuBar && menuBar.height)
      ws.height = h - menuBar.height;
    else
      ws.height = h - 48;
    //console.log("Workspace size: " + ws.width + " x " + ws.height);

    const diagPanel =  document.getElementById("diag");
    if(diagPanel) {
      const dPanel = diagPanel.parentElement;  
      diagPanel.style.height =  ws.height / 4 + 'px';
      diagPanel.style.width =  ws.width - 8 + 'px';
      console.log("setSizes-diagHeight="+diagPanel.style.height);
      dPanel.clientHeight = ws.height / 4;
      dPanel.clientWidth = ws.width -8;
    }
    else
      console.log("diagPanel not found");

    setTextareaSizes("txtEnv");
    setTextareaSizes("txtBeh");
    setTextareaSizes("txtAct");
    setTextareaSizes("txtTgt");
  }
  else
    console.log("Workspace not found");
}

function refreshItem(id) {
  var element = document.getElementById(id);
  if(element) {
    //var content = element.innerHTML;
    //element.innerHTML= content; 
    var n = document.createTextNode(' ');
    var disp = element.style.display;  // don't worry about previous display style
    element.appendChild(n);
    element.style.display = 'none';

    setTimeout(function(){
        n.parentNode.removeChild(n);
        element.style.display = disp;
      },2);
    }
}

function diag(msg) {
    var element = document.getElementById("diag");
    var n = document.createTextNode(msg);
    if(element)
      element.appendChild(n);

    var br = document.createElement("br");  
    element.append(br)
}

function output(msg) {
    var element = document.getElementById("runOutput");
    if(element) {
      var n = document.createTextNode(msg);
      element.appendChild(n);

      var br = document.createElement("br");  
      element.append(br)
    }
}


</script>
</head>
<body onload="setSizes()" onresize="setSizes()">
  <app-root></app-root>
</body>
</html>
