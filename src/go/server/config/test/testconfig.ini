[SymAI]
debug                 = True
host                  = localhost
host_expression       = localhost
tempdir               = /tmpdir/temp
ai                    = False
port                  = 12345
port_expressioin      = 8080
reenter_counter       = 1
hostconfig            = symaicore
expression_hostconfig = expression

[Expression]
host              = localhost
expression_solver = Z3
solver_max_models = 10
port              = 8080
hostconfig        = expression

[Frontend]
host                 = localhost
symaicore_host       = localhost
resources            = /app/resources
port                 = 8000
symaicore_port       = 12345
hostconfig           = frontend
symaicore_hostconfig = symaicore

[logger_root]
level     = DEBUG
handlers  = consoleHandler
qualname  = 
propagate = 0

[logger_expression]
level     = DEBUG
handlers  = consoleHandler,file
qualname  = expression
propagate = 0

[logger_symaicore]
level     = DEBUG
handlers  = consoleHandler,file_symaicore
qualname  = symaicore
propagate = 0

[logger_frontend]
level     = DEBUG
handlers  = consoleHandler,file
qualname  = frontend
propagate = 0

[formatter_simpleFormatter]
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s

[handler_file]
level       = DEBUG
args        = ('/logdir/expression.log',)
class       = handlers.TimedRotatingFileHandler
formatter   = simpleFormatter
backupcount = 5
interval    = midnight

[handler_file_symaicore]
level       = DEBUG
args        = ('/logdir/symaicore.log',)
class       = handlers.TimedRotatingFileHandler
formatter   = simpleFormatter
backupcount = 5
interval    = midnight

[handler_file_frontend]
level       = DEBUG
args        = ('/logdir/frontend.log',)
class       = handlers.TimedRotatingFileHandler
formatter   = simpleFormatter
backupcount = 5
interval    = midnight

[handler_consoleHandler]
level       = DEBUG
args        = (sys.stdout,)
class       = StreamHandler
formatter   = simpleFormatter
backupcount = 0
interval    = 

[httpserver_symaicore]
host          = localhost
port          = 12345
read_timeout  = 5
write_timeout = 5
idle_timeout  = 36000

[httpserver_frontend]
host          = localhost
port          = 8000
read_timeout  = 5
write_timeout = 5
idle_timeout  = 36000

[httpserver_expression]
host          = localhost
port          = 8080
read_timeout  = 5
write_timeout = 5
idle_timeout  = 36000

[wss_symaicore]
max_connections    = 10
read_buffer_size   = 2048
write_buffer_size  = 2048
handshake_timeout  = 60
enable_compression = true
write_wait         = 10
ping_period        = 60
pong_wait          = 54
max_message_size   = 524288
entry_point        = /

[loggers]
keys = root,expression,symaicore,frontend

[handlers]
keys = file,file_symaicore,file_frontend,consoleHandler

[formatters]
keys = simpleFormatter

[httpconfigs]
keys = symaicore,frontend,expression

[wssconfigs]
keys = symaicore
